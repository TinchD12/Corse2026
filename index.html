function t(k){return UI[lang][k]}
function visible(p){return filter==='all'||p.zone===filter||p.type===filter||(filter==='extra'&&p.zone==='extra')}

function toggleFav(id){let a=favs();saveFavs(a.includes(id)?a.filter(x=>x!==id):[...a,id]);renderCards();renderFavs()}

 c.querySelector('.fav').onclick=()=>toggleFav(p.id);box.appendChild(c);});
}
function renderFavs(){const ids=favs(),b=document.getElementById('favlist'),e=document.getElementById('favempty');b.innerHTML='';e.style.display=ids.length?'none':'block';ids.forEach(id=>{const p=P.find(x=>x.id===id);if(!p)return;let x=document.createElement('button');x.textContent=p.emoji+' '+p.name;x.onclick=()=>document.getElementById('place-'+id)?.scrollIntoView({behavior:'smooth'});b.appendChild(x)})}
