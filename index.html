<!doctype html>

<head>

<title>Corse 2026 · Notre guide en famille</title>
<meta name="description" content="33 idées de sorties en Corse : plages, villages et nature depuis Calvi et Porto-Vecchio. Guide familial en français et en espagnol.">

<style>
:root{--ink:#16322e;--muted:#6c7c78;--forest:#123f3a;--sea:#287d83;--paper:#fffdf8;--sand:#f4eee3;--line:#e5ddd1;--warn:#fff0d0;--warntext:#744900}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,a{font:inherit}.wrap{max-width:1180px;margin:auto;padding:0 18px}
.hero{min-height:470px;display:flex;align-items:flex-end;color:white;position:relative;overflow:hidden;background:#123f3a}.hero-bg{position:absolute;inset:0;background:url("assets/photos/bonifacio.webp") center/cover}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#092f2cdd,#092f2c55),linear-gradient(0deg,#092f2ca8,transparent)}.hero .wrap{position:relative;z-index:2;width:100%;padding-bottom:48px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:850;opacity:.8}h1{font:700 clamp(54px,9vw,94px)/.9 Georgia,serif;letter-spacing:-.03em;margin:10px 0 15px}.hero p{max-width:700px;font-size:18px;line-height:1.55;margin:0}.hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.hero-meta span{padding:9px 12px;border:1px solid #ffffff40;border-radius:999px;background:#ffffff12;backdrop-filter:blur(10px);font-size:13px}
.sticky{position:sticky;top:0;z-index:50;background:#fffdf8eb;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.bar{display:flex;align-items:center;gap:10px}.chips{display:flex;gap:8px;overflow:auto;padding:11px 0;scrollbar-width:none;flex:1}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;padding:10px 14px;font-weight:780;cursor:pointer}.chip.on{background:var(--forest);border-color:var(--forest);color:white}
.lang{display:flex;flex:0 0 auto;border:1px solid var(--line);background:white;border-radius:999px;padding:3px}.lang button{border:0;background:transparent;border-radius:999px;padding:7px 9px;font-size:12px;font-weight:850;cursor:pointer;color:var(--muted)}.lang button.on{background:var(--forest);color:white}
section{padding:34px 0}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:17px}h2{font:700 34px/1.05 Georgia,serif;margin:0}.sub{max-width:760px;color:var(--muted);line-height:1.5;margin:7px 0 0}.count{font-size:13px;color:var(--muted);white-space:nowrap}
#map{height:520px;border-radius:26px;border:1px solid var(--line);overflow:hidden;box-shadow:0 14px 42px #123f3a16}.marker{width:40px;height:40px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;box-shadow:0 5px 15px #0004;background:white;font-size:18px;cursor:pointer}.marker.beach{background:#dff4f3}.marker.nature{background:#e3efe2}.marker.culture{background:#f7e5da}
.note{margin-top:13px;padding:13px 15px;border-radius:16px;background:#eef5f2;border:1px solid #dae9e4;color:#405954;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{scroll-margin-top:82px;background:#fff;border:1px solid var(--line);border-radius:25px;overflow:hidden;box-shadow:0 7px 25px #123f3a0b;transition:.25s ease}.card:hover{transform:translateY(-3px);box-shadow:0 15px 42px #123f3a18}.card.extra{border-left:4px solid #d4ad68}.photo-missing:before{content:'Photo indisponible';position:absolute;inset:0;display:grid;place-items:center;color:#6c7c78;font-weight:800;background:linear-gradient(135deg,#e7efec,#f4eee3)}.photo{height:275px;position:relative;overflow:hidden;background:linear-gradient(135deg,#dceae6,#f1dfce)}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .65s ease}.card:hover .photo img{transform:scale(1.025)}.photo:after{content:"";position:absolute;inset:52% 0 0;background:linear-gradient(transparent,#0007)}.tag{position:absolute;z-index:2;left:14px;bottom:14px;background:#fffffff1;backdrop-filter:blur(8px);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:850}
.body{padding:18px}.zone{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--sea);font-weight:850}.extra .zone{color:#8d6a31}h3{font-size:23px;line-height:1.15;margin:5px 0 11px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.meta span{padding:7px 9px;background:#faf6ee;border-radius:999px;color:#586a65;font-size:12px}.desc{font-size:14.5px;line-height:1.55;color:#405651;margin:0 0 13px}.advice{padding:12px 13px;border-radius:15px;background:var(--sand);font-size:13.5px;line-height:1.45}.advice b{display:block;margin-bottom:3px}.alert{margin-top:10px;padding:12px 13px;border-radius:15px;background:var(--warn);border:1px solid #efd391;color:var(--warntext);font-size:13.5px;line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:14px}.btn{min-height:47px;border-radius:13px;border:0;text-decoration:none;display:grid;place-items:center;font-weight:820;cursor:pointer;padding:9px 11px;text-align:center}.route{background:var(--forest);color:white}.learn{background:#e9f2ef;color:var(--forest);border:1px solid #d6e5df}.fav{width:48px;background:var(--sand);color:var(--ink);font-size:20px}.fav.on{background:#f2ddd5;color:#a24231}
.favbox{background:linear-gradient(135deg,var(--forest),#1f5c55);color:white;border-radius:24px;padding:22px}.favbox h2{font-size:28px}#favlist{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#favlist button{border:1px solid #ffffff28;background:#ffffff15;color:white;padding:9px 11px;border-radius:999px;cursor:pointer}
footer{padding:22px 0 90px;color:var(--muted);font-size:12px;line-height:1.55}
@media(max-width:760px){.wrap{padding:0 14px}.hero{min-height:500px}.hero .wrap{padding-bottom:34px}.hero p{font-size:16px}.bar{align-items:stretch}.lang{align-self:center}section{padding:27px 0}h2{font-size:29px}.count{display:none}#map{height:57vh;min-height:430px;border-radius:20px}.grid{grid-template-columns:1fr;gap:14px}.photo-missing:before{content:'Photo indisponible';position:absolute;inset:0;display:grid;place-items:center;color:#6c7c78;font-weight:800;background:linear-gradient(135deg,#e7efec,#f4eee3)}.photo{height:230px}.body{padding:15px}h3{font-size:21px}.actions{grid-template-columns:1fr 1fr 48px}.btn{font-size:13px}}

:focus-visible{outline:3px solid #bb7035;outline-offset:4px}
.hero-bg{background-position:center 48%}.hero:after{background:linear-gradient(90deg,#092f2cc9,#092f2c22),linear-gradient(0deg,#092f2c9c,transparent)}
.photo-credit{position:absolute;right:12px;top:12px;z-index:2;background:#123f3acc;color:#fff;font-size:11px;padding:5px 8px;border-radius:7px;text-decoration:none;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrival{font-size:12px;color:var(--muted);line-height:1.5;margin:12px 0 0}.meta span{line-height:1.4}.meta strong{font-weight:750}.map-status{padding:30px;line-height:1.6;max-width:620px}.map-failed{height:auto!important;min-height:120px!important}
.photo-missing:before{content:attr(data-error)}.updated{margin-top:20px;font-size:11px}details{margin-top:20px}summary{cursor:pointer;font-weight:700}#photoCredits{columns:2;line-height:1.8;margin-top:14px}#photoCredits a{color:var(--sea);overflow-wrap:anywhere}#photoCredits p{break-inside:avoid;margin:0 0 10px}.chip{min-height:44px}.lang button{min-height:40px}.grid>.empty{grid-column:1/-1}
@media(max-width:760px){.bar{gap:6px}.chip{padding:9px 12px}.lang button{padding:7px 8px}.hero{min-height:420px}.photo{height:240px}#photoCredits{columns:1}.card{scroll-margin-top:90px}.head{align-items:start}.count{display:block;font-size:11px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important;animation:none!important}.card:hover{transform:none}}
</style>
</head><body>
<header class="hero"><div class="hero-bg"></div><div class="wrap"><div class="kicker" data-i18n="kicker"></div><h1 data-i18n="island">Corse</h1><p data-i18n="hero"></p><div class="hero-meta"><span>26 sept → 4 oct 2026</span><span>Calvi → Porto-Vecchio</span><span id="langPill">🇫🇷 Français</span></div></div></header>
<nav class="sticky"><div class="wrap bar"><div class="chips">
<button class="chip on" data-f="all" data-i18n="all"></button><button class="chip" data-f="calvi">Calvi</button><button class="chip" data-f="pv">Porto-Vecchio</button><button class="chip" data-f="beach" data-i18n="beaches"></button><button class="chip" data-f="culture" data-i18n="culture"></button><button class="chip" data-f="nature" data-i18n="nature"></button><button class="chip" data-f="extra" data-i18n="long"></button>
</div><div class="lang" aria-label="Langue / Idioma"><button id="frBtn" class="on">FR</button><button id="esBtn">ES</button></div></div></nav>

<section><div class="wrap"><div class="head"><div><h2 data-i18n="placesTitle"></h2><p class="sub" data-i18n="placesSub"></p></div><div class="count" id="count" role="status" aria-live="polite"></div></div><div class="grid" id="cards"></div></div></section>
